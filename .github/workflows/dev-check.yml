name: DEV-CHECK

on:
  push:
    branches-ignore:
      - main

env:
  IMAGE_TAG: "lishuaidev/${{ github.event.repository.name }}:${{ github.sha }}-dev"


jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Style Check And Test
        run: ./gradlew check --info


  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: review
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Jar
        run: ./gradlew clean bootJar --no-daemon --parallel

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}


  update-argocd-config:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ArgoCD config repo
        uses: actions/checkout@v4
        with:
          repository: bloom-mall/mall-deployments

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tag via kustomize
        run: |
          cd mall
          kustomize edit set image mall-product-image-placeholder=${{ env.IMAGE_TAG }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BOT_PR_TOKEN }}
          commit-message: "chore: Update ${{ github.event.repository.name }} image tag"
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          branch: update-${{ github.event.repository.name }}-image-tag
          title: "[Dev] Update ${{ github.event.repository.name }} image tag"
          body: |
            Update Image Tag for ${{ github.event.repository.name }}
            - New image tag: `${{ env.IMAGE_TAG }}`
            - Auto-generated by [workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          labels: |
            automated-pr
            image-update
          draft: false
          delete-branch: true
